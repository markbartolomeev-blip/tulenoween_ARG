<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tulenoween</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
  }

  /* ===== ЭКРАН ЗАГРУЗКИ ===== */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ff8c1a;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 18px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.5px;
  }

  /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
  #main {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #main.visible {
    opacity: 1;
  }

  #imageWrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #mainImage {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.5s ease;
    cursor: pointer;
  }

  /* Эмодзи тыквы поверх картинки */
  #pumpkinEmoji {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 140px;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    z-index: 20;
    filter: drop-shadow(0 0 30px rgba(255, 140, 26, 0.8));
  }

  #pumpkinEmoji.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* ===== ПЛАШКА APPLE LIQUID GLASS ===== */
  #glassPlate {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    padding: 14px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.35),
      inset 0 1px 1px rgba(255, 255, 255, 0.45),
      inset 0 -1px 1px rgba(255, 255, 255, 0.1);
    text-align: center;
    white-space: nowrap;
    transition: transform 0.3s ease;
  }

  /* блик сверху для эффекта стекла */
  #glassPlate::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 50%;
    border-radius: 26px 26px 60% 60%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.22), rgba(255,255,255,0));
    pointer-events: none;
  }

  .plate-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 4px;
  }

  #timerDisplay {
    display: block;
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 140, 26, 0.6);
    transition: color 0.3s ease;
  }

  #timerDisplay.savetext {
    color: #ff8c1a;
    text-shadow: 0 0 30px rgba(255, 140, 26, 1);
    animation: pulse 0.8s ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  /* Адаптив */
  @media (max-width: 480px) {
    #glassPlate { padding: 12px 22px; bottom: 22px; }
    #timerDisplay { font-size: 24px; }
    .plate-label { font-size: 11px; }
    #pumpkinEmoji { font-size: 100px; }
  }
</style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Загрузка...</div>
  </div>

  <!-- Основной контент -->
  <div id="main">
    <div id="imageWrap">
      <img id="mainImage"
           src="https://markbartolomeev-blip.github.io/tulenoween_ARG/953E7D71-CB75-4280-9C05-90CD076074B4.jpeg"
           alt="Tulenoween">
      <div id="pumpkinEmoji">🎃</div>
    </div>

    <div id="glassPlate">
      <span class="plate-label" id="plateLabel">До Открытия:</span>
      <span id="timerDisplay">00:00:00</span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ========== КОНФИГ ========== */
  // Дата открытия: 21 сентября 2026, 00:00 (месяцы с нуля: 8 = сентябрь)
  const OPENING_DATE = new Date(2026, 8, 21, 0, 0, 0);
  const REQUIRED_TAPS = 10;
  const SECRET_DURATION = 3000; // 3 секунды

  /* ========== ЭЛЕМЕНТЫ ========== */
  const loader       = document.getElementById("loader");
  const main         = document.getElementById("main");
  const img          = document.getElementById("mainImage");
  const pumpkin      = document.getElementById("pumpkinEmoji");
  const timerDisplay = document.getElementById("timerDisplay");
  const plateLabel   = document.getElementById("plateLabel");

  /* ========== ЗАГРУЗКА КАРТИНКИ ========== */
  function startSite() {
    loader.classList.add("hidden");
    main.classList.add("visible");
    startTimer();
  }

  // Если картинка уже в кэше
  if (img.complete && img.naturalWidth > 0) {
    setTimeout(startSite, 300);
  } else {
    img.addEventListener("load", () => setTimeout(startSite, 300));
    img.addEventListener("error", () => {
      setTimeout(startSite, 300);
    });
  }

  /* ========== ТАЙМЕР ========== */
  let timerInterval = null;
  let secretActive = false;

  function pad(n) { return String(n).padStart(2, "0"); }

  function updateTimer() {
    if (secretActive) return;

    const now = Date.now();
    let diff = OPENING_DATE.getTime() - now;

    if (diff <= 0) {
      timerDisplay.textContent = "ОТКРЫТО!";
      plateLabel.textContent = "🎃";
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const days  = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins  = Math.floor((totalSec % 3600) / 60);
    const secs  = totalSec % 60;

    if (days > 0) {
      timerDisplay.textContent =
        days + "д " + pad(hours) + ":" + pad(mins) + ":" + pad(secs);
    } else {
      timerDisplay.textContent =
        pad(hours) + ":" + pad(mins) + ":" + pad(secs);
    }
  }

  function startTimer() {
    updateTimer();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
  }

  /* ========== СЕКРЕТНОЕ СОБЫТИЕ (10 ТАПОВ) ========== */
  let tapCount = 0;
  let tapResetTimer = null;
  let secretTimeout = null;

  function handleTap() {
    if (secretActive) return;

    tapCount++;

    clearTimeout(tapResetTimer);
    tapResetTimer = setTimeout(() => { tapCount = 0; }, 1500);

    if (navigator.vibrate) navigator.vibrate(8);

    if (tapCount >= REQUIRED_TAPS) {
      tapCount = 0;
      clearTimeout(tapResetTimer);
      activateSecret();
    }
  }

  function activateSecret() {
    secretActive = true;

    img.style.opacity = "0.08";
    pumpkin.classList.add("show");

    plateLabel.textContent = "";
    timerDisplay.textContent = "SAVE THE HIM";
    timerDisplay.classList.add("savetext");

    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

    clearTimeout(secretTimeout);
    secretTimeout = setTimeout(() => {
      img.style.opacity = "1";
      pumpkin.classList.remove("show");
      timerDisplay.classList.remove("savetext");
      plateLabel.textContent = "До Открытия:";
      secretActive = false;
      updateTimer();
    }, SECRET_DURATION);
  }

  // Обработчики тапов
  img.addEventListener("click", handleTap);
  img.addEventListener("touchstart", function (e) {
    e.preventDefault();
    handleTap();
  }, { passive: false });

})();
</script>

</body>
</html>
