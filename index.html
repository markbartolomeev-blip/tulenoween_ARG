<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tulenoween</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: #fff;
  }

  /* ===== ЭКРАН ЗАГРУЗКИ ===== */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: #ff8c1a;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 18px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.5px;
  }

  /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
  #main {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #main.visible {
    opacity: 1;
  }

  #imageWrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1500px;
  }

  #mainImage {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.5s ease;
    cursor: pointer;
    z-index: 10;
  }

  #pumpkinEmoji {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 140px;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    z-index: 20;
    filter: drop-shadow(0 0 30px rgba(255, 140, 26, 0.8));
  }

  #pumpkinEmoji.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  /* ===== 3D СЦЕНА ===== */
  #flipScene {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    perspective: 1600px;
    z-index: 15;
  }

  #flipScene.active {
    display: flex;
  }

  #flipCard {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .flip-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .flip-face img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  #flipBack {
    transform: rotateY(180deg);
  }

  .flip-hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 25;
    animation: hintPulse 2s ease-in-out infinite;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* ===== ПЛАШКА APPLE LIQUID GLASS ===== */
  #glassPlate {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    padding: 14px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.35),
      inset 0 1px 1px rgba(255, 255, 255, 0.45),
      inset 0 -1px 1px rgba(255, 255, 255, 0.1);
    text-align: center;
    white-space: nowrap;
    transition: transform 0.4s ease, opacity 0.5s ease;
  }

  #glassPlate.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(30px);
    pointer-events: none;
  }

  #glassPlate::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 50%;
    border-radius: 26px 26px 60% 60%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.22), rgba(255,255,255,0));
    pointer-events: none;
  }

  .plate-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 4px;
  }

  #timerDisplay {
    display: block;
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 140, 26, 0.6);
    transition: color 0.3s ease;
  }

  #timerDisplay.savetext {
    color: #ff8c1a;
    text-shadow: 0 0 30px rgba(255, 140, 26, 1);
    animation: pulse 0.8s ease-in-out infinite alternate;
    font-size: 22px;
    letter-spacing: 3px;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  @media (max-width: 480px) {
    #glassPlate { padding: 12px 22px; bottom: 22px; }
    #timerDisplay { font-size: 24px; }
    #timerDisplay.savetext { font-size: 18px; }
    .plate-label { font-size: 11px; }
    #pumpkinEmoji { font-size: 100px; }
    .flip-hint { bottom: 8px; font-size: 10px; }
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Загрузка...</div>
  </div>

  <div id="main">
    <div id="imageWrap">
      <img id="mainImage"
           src="https://markbartolomeev-blip.github.io/tulenoween_ARG/953E7D71-CB75-4280-9C05-90CD076074B4.jpeg"
           alt="Tulenoween">

      <div id="pumpkinEmoji">🎃</div>

      <div id="flipScene">
        <div id="flipCard">
          <div class="flip-face" id="flipFront">
            <img id="frontImg" src="" alt="Front" draggable="false">
          </div>
          <div class="flip-face" id="flipBack">
            <img id="backImg"
                 src="https://markbartolomeev-blip.github.io/tulenoween_ARG/5804DA2B-A9FF-4168-9755-269AEDE9D162.jpeg"
                 alt="Back" draggable="false">
          </div>
        </div>
        <div class="flip-hint">← Прокрути →</div>
      </div>
    </div>

    <div id="glassPlate">
      <span class="plate-label" id="plateLabel">До Открытия:</span>
      <span id="timerDisplay">00:00:00</span>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ========== КОНФИГ ========== */
  const OPENING_DATE = new Date(2026, 8, 22, 0, 0, 0); // 22 сентября 2026, 00:00
  const BASE_URL = "https://markbartolomeev-blip.github.io/tulenoween_ARG/";
  const IMG_AFTER_FRONT = "29722FF0-5127-4496-AB44-19FD50837348.jpeg";
  const IMG_AFTER_BACK  = "5804DA2B-A9FF-4168-9755-269AEDE9D162.jpeg";
  const REQUIRED_TAPS = 10;
  const SECRET_DURATION = 3000;

  /* ========== ЭЛЕМЕНТЫ ========== */
  const loader       = document.getElementById("loader");
  const main         = document.getElementById("main");
  const img          = document.getElementById("mainImage");
  const pumpkin      = document.getElementById("pumpkinEmoji");
  const flipScene    = document.getElementById("flipScene");
  const flipCard     = document.getElementById("flipCard");
  const frontImg     = document.getElementById("frontImg");
  const backImg      = document.getElementById("backImg");
  const timerDisplay = document.getElementById("timerDisplay");
  const plateLabel   = document.getElementById("plateLabel");
  const glassPlate   = document.getElementById("glassPlate");

  let opened = false;

  /* ========== ПРЕДЗАГРУЗКА КАРТИНОК ДЛЯ 3D ========== */
  const preloadedFront = new Image();
  const preloadedBack  = new Image();
  preloadedFront.src = BASE_URL + IMG_AFTER_FRONT;
  preloadedBack.src  = BASE_URL + IMG_AFTER_BACK;

  /* ========== СТАРТ САЙТА ========== */
  function startSite() {
    loader.classList.add("hidden");
    main.classList.add("visible");
    startTimer();
  }

  if (img.complete && img.naturalWidth > 0) {
    setTimeout(startSite, 300);
  } else {
    img.addEventListener("load", () => setTimeout(startSite, 300));
    img.addEventListener("error", () => setTimeout(startSite, 300));
  }

  /* ========== ТАЙМЕР ========== */
  let timerInterval = null;

  function pad(n) { return String(n).padStart(2, "0"); }

  function updateTimer() {
    if (opened) return;

    const diff = OPENING_DATE.getTime() - Date.now();

    if (diff <= 0) {
      triggerOpening();
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const days  = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins  = Math.floor((totalSec % 3600) / 60);
    const secs  = totalSec % 60;

    timerDisplay.textContent = days > 0
      ? days + "д " + pad(hours) + ":" + pad(mins) + ":" + pad(secs)
      : pad(hours) + ":" + pad(mins) + ":" + pad(secs);
  }

  function startTimer() {
    updateTimer();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
  }

  /* ========== ОТКРЫТИЕ ========== */
  function triggerOpening() {
    if (opened) return;
    opened = true;

    clearInterval(timerInterval);

    function show3D() {
      frontImg.src = preloadedFront.src;
      backImg.src  = preloadedBack.src;

      img.style.opacity = "0";
      glassPlate.classList.add("hidden");

      setTimeout(() => {
        img.style.display = "none";
        pumpkin.style.display = "none";
        flipScene.classList.add("active");
        enableFlip();
      }, 400);

      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    }

    if (preloadedFront.complete && preloadedBack.complete) {
      show3D();
    } else {
      let loaded = 0;
      const onOneLoaded = () => {
        loaded++;
        if (loaded >= 2) show3D();
      };
      if (preloadedFront.complete) loaded++; else preloadedFront.addEventListener("load", onOneLoaded, { once: true });
      if (preloadedBack.complete)  loaded++; else preloadedBack.addEventListener("load",  onOneLoaded, { once: true });

      setTimeout(() => {
        if (!flipScene.classList.contains("active")) show3D();
      }, 5000);
    }
  }

  /* ========== 3D ПРОКРУТКА ========== */
  let isDragging = false;
  let startX = 0;
  let currentRot = 0;
  let startRot = 0;
  let velocity = 0;
  let lastX = 0;
  let lastTime = 0;
  let rafId = null;
  let flipEnabled = false;

  function enableFlip() {
    if (flipEnabled) return;
    flipEnabled = true;

    const el = flipScene;
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
  }

  function getX(e) {
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  function onDown(e) {
    isDragging = true;
    startX = getX(e);
    startRot = currentRot;
    lastX = startX;
    lastTime = performance.now();
    velocity = 0;
    cancelAnimationFrame(rafId);
    if (e.cancelable) e.preventDefault();
  }

  function onMove(e) {
    if (!isDragging) return;
    const x = getX(e);
    const dx = x - startX;
    const sensitivity = 0.5;
    currentRot = startRot + dx * sensitivity;

    const now = performance.now();
    const dt = now - lastTime;
    if (dt > 0) velocity = (x - lastX) / dt * 16;
    lastX = x;
    lastTime = now;

    applyRotation();
    if (e.cancelable) e.preventDefault();
  }

  function onUp() {
    if (!isDragging) return;
    isDragging = false;
    const inertia = velocity * 8;
    const target = currentRot + inertia;
    const normalized = ((target % 360) + 360) % 360;
    let snapTarget;
    if (normalized < 90 || normalized >= 270) {
      snapTarget = Math.round(target / 360) * 360;
    } else {
      snapTarget = Math.round((target - 180) / 360) * 360 + 180;
    }
    animateTo(snapTarget);
  }

  function animateTo(target) {
    const start = currentRot;
    const delta = target - start;
    const duration = 500;
    const t0 = performance.now();

    function step(t) {
      const p = Math.min((t - t0) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      currentRot = start + delta * eased;
      applyRotation();
      if (p < 1) rafId = requestAnimationFrame(step);
      else { currentRot = target; applyRotation(); }
    }
    rafId = requestAnimationFrame(step);
  }

  function applyRotation() {
    flipCard.style.transform = "rotateY(" + currentRot + "deg)";
  }

  /* ========== СЕКРЕТ (10 ТАПОВ) ========== */
  let tapCount = 0;
  let tapResetTimer = null;
  let secretTimeout = null;
  let secretActive = false;

  function handleTap() {
    if (secretActive || opened) return;

    tapCount++;
    clearTimeout(tapResetTimer);
    tapResetTimer = setTimeout(() => { tapCount = 0; }, 1500);

    if (navigator.vibrate) navigator.vibrate(8);

    if (tapCount >= REQUIRED_TAPS) {
      tapCount = 0;
      clearTimeout(tapResetTimer);
      activateSecret();
    }
  }

  function activateSecret() {
    secretActive = true;

    img.style.opacity = "0.08";
    pumpkin.classList.add("show");

    plateLabel.textContent = "";
    timerDisplay.textContent = "SAVE THE SON";
    timerDisplay.classList.add("savetext");

    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

    clearTimeout(secretTimeout);
    secretTimeout = setTimeout(() => {
      img.style.opacity = "1";
      pumpkin.classList.remove("show");
      timerDisplay.classList.remove("savetext");

      if (!opened) {
        plateLabel.textContent = "До Открытия:";
        updateTimer();
      }
      secretActive = false;
    }, SECRET_DURATION);
  }

  if (window.PointerEvent) {
    img.addEventListener("pointerdown", handleTap);
  } else {
    img.addEventListener("click", handleTap);
    img.addEventListener("touchstart", function (e) {
      e.preventDefault();
      handleTap();
    }, { passive: false });
  }

})();
</script>

</body>
</html>
